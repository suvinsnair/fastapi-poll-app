<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pollroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #EDF0F7;
      --surface: #FFFFFF;
      --ink: #17203A;
      --muted: #5B6480;
      --line: #D3D9E8;
      --primary: #3B4FE0;
      --primary-ink: #FFFFFF;
      --danger: #C23A2B;
      --radius-lg: 18px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.5;
      font-size: 1rem;
    }

    a { color: var(--primary); }

    :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

    /* ---------- Top bar ---------- */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 1100px;
      margin: 0 auto;
      padding: 18px 24px;
    }
    .brand {
      font-weight: 800;
      font-size: 1.35rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-mark { display: flex; align-items: flex-end; gap: 3px; height: 22px; }
    .brand-mark i { display: block; width: 6px; border-radius: 2px; }
    .brand-mark i:nth-child(1) { height: 45%; background: #F06A55; }
    .brand-mark i:nth-child(2) { height: 100%; background: var(--primary); }
    .brand-mark i:nth-child(3) { height: 70%; background: #17A398; }
    .topbar nav a { color: var(--muted); text-decoration: none; font-weight: 600; }
    .topbar nav a:hover { color: var(--ink); }

    main { max-width: 1100px; margin: 0 auto; padding: 8px 24px 72px; }

    h1, h2, h3 { line-height: 1.15; letter-spacing: -0.02em; margin: 0; }

    .muted { color: var(--muted); }
    .center { text-align: center; }

    /* ---------- Buttons & inputs ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font: inherit;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--ink);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }
    .btn:hover { background: var(--bg); }
    .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
    .btn.primary:hover { background: #2F41C4; }
    .btn.primary:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn.quiet { border-color: var(--line); }
    .btn.danger { border-color: transparent; color: var(--danger); background: transparent; }
    .btn.danger:hover { background: #FBE9E6; }
    .btn.big { font-size: 1.15rem; padding: 14px 28px; }

    .link-btn {
      font: inherit; font-weight: 600; color: var(--primary);
      background: none; border: none; padding: 6px 0; cursor: pointer;
    }

    label, legend { font-weight: 600; display: block; margin-bottom: 6px; padding: 0; }

    input[type="text"] {
      width: 100%;
      font: inherit;
      padding: 11px 14px;
      border: 1.5px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
    }
    input[type="text"]:focus { border-color: var(--primary); outline: none; }

    fieldset { border: none; padding: 0; margin: 20px 0 0; }

    .error { color: var(--danger); font-weight: 600; min-height: 1.5em; margin: 12px 0; }

    /* ---------- Presenter screen ---------- */
    .presenter {
      display: grid;
      grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
      gap: 40px;
      align-items: start;
    }
    .panel {
      background: var(--surface);
      border-radius: var(--radius-lg);
      padding: 28px;
      border: 1.5px solid var(--line);
    }
    .panel h1 { font-size: 1.6rem; margin-bottom: 20px; }

    .option-row { display: flex; gap: 8px; margin-bottom: 8px; }
    .option-row .swatch { width: 8px; border-radius: 4px; flex: none; }
    .remove-option {
      flex: none; width: 44px; font: inherit; font-size: 1.3rem;
      border: 1.5px solid var(--line); background: var(--surface); color: var(--muted);
      border-radius: var(--radius-sm); cursor: pointer;
    }
    .remove-option:disabled { opacity: 0.35; cursor: not-allowed; }

    .list-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; }
    .list-head h2 { font-size: 1.6rem; }

    .q-item { padding: 22px 0; border-top: 1.5px solid var(--line); }
    .q-item h3 { font-size: 1.3rem; margin-bottom: 4px; }
    .q-item .options-preview { margin: 0 0 14px; color: var(--muted); }
    .share { display: flex; gap: 8px; margin-bottom: 12px; }
    .share input { font-size: 0.9rem; color: var(--muted); }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .empty-state {
      border: 2px dashed var(--line);
      border-radius: var(--radius-lg);
      padding: 40px 24px;
      text-align: center;
      color: var(--muted);
    }

    /* ---------- Voting screen ---------- */
    .vote { max-width: 640px; margin: 24px auto 0; }
    .vote h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); font-weight: 800; margin-bottom: 28px; }
    .choices { display: grid; gap: 12px; margin-bottom: 8px; }
    .choice {
      display: flex; align-items: center; gap: 14px;
      font: inherit; font-size: 1.15rem; font-weight: 600; text-align: left;
      padding: 18px 20px;
      background: var(--surface);
      border: 2px solid var(--line);
      border-radius: var(--radius-lg);
      color: var(--ink);
      cursor: pointer;
    }
    .choice:hover { border-color: var(--muted); }
    .choice .dot {
      flex: none; width: 22px; height: 22px; border-radius: 50%;
      border: 2px solid var(--line); background: var(--surface);
    }
    .choice[aria-checked="true"] { border-color: var(--c); }
    .choice[aria-checked="true"] .dot { border-color: var(--c); background: var(--c); box-shadow: inset 0 0 0 4px var(--surface); }

    .thanks { text-align: center; max-width: 520px; margin: 64px auto 0; }
    .thanks .tick {
      width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 20px;
      background: #17A398; color: #fff; display: grid; place-items: center; font-size: 2.2rem;
    }
    .thanks h1 { font-size: 2.2rem; margin-bottom: 8px; }
    .thanks .actions { justify-content: center; margin-top: 28px; }

    /* ---------- Results screen (the big projector view) ---------- */
    .results-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: center; margin-bottom: 24px; }
    .join { color: var(--muted); }
    .join strong { color: var(--ink); word-break: break-all; }

    .results h1 {
      font-size: clamp(2rem, 5.5vw, 3.6rem);
      font-weight: 800;
      letter-spacing: -0.035em;
      max-width: 22ch;
      margin-bottom: 36px;
    }
    .bars { list-style: none; padding: 0; margin: 0; display: grid; gap: 22px; }
    .bar-label {
      display: flex; justify-content: space-between; gap: 16px;
      font-size: 1.25rem; font-weight: 600; margin-bottom: 8px;
    }
    .bar-num { font-variant-numeric: tabular-nums; white-space: nowrap; }
    .bar-num small { color: var(--muted); font-weight: 400; font-size: 1rem; margin-left: 6px; }
    .bar-track { height: 54px; background: var(--surface); border-radius: 14px; overflow: hidden; }
    .bar-fill {
      height: 100%; width: 0; background: var(--c);
      border-radius: 14px;
      transition: width 0.7s cubic-bezier(.2, .8, .2, 1);
    }
    .total { margin-top: 32px; font-size: 1.15rem; color: var(--muted); }
    .total strong { color: var(--ink); font-size: 1.6rem; font-variant-numeric: tabular-nums; }

    @media (max-width: 820px) {
      .presenter { grid-template-columns: 1fr; gap: 32px; }
      .bar-track { height: 40px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bar-fill { transition: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      Pollroom
    </a>
    <nav><a href="/docs" target="_blank" rel="noopener">API docs</a></nav>
  </header>

  <main id="app"></main>

  <script>
    // ================================================================
    //  Helpers
    // ================================================================
    const app = document.getElementById("app");
    const COLORS = ["#3B4FE0", "#F06A55", "#17A398", "#E9A92C", "#9B5DE5", "#2E86C1", "#D9488B", "#6B8E23", "#8D6E63", "#455A64"];

    // Every call to the backend goes through this one function.
    async function api(path, options = {}) {
      const response = await fetch("/api" + path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });

      if (!response.ok) {
        let message = `Request failed with status ${response.status}`;
        try {
          const data = await response.json();
          // FastAPI errors: {"detail": "text"} or {"detail": [{msg: ...}]}
          if (typeof data.detail === "string") message = data.detail;
          else if (Array.isArray(data.detail)) message = data.detail.map(e => e.msg).join(". ");
        } catch (_) { /* response had no JSON body */ }
        throw new Error(message);
      }

      return response.status === 204 ? null : response.json();
    }

    // Stops text typed by users from being run as HTML.
    function esc(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function voteLink(id) {
      return `${location.origin}/#/vote/${id}`;
    }

    function notFound(message) {
      return `
        <section class="thanks">
          <h1>That question isn't available</h1>
          <p class="muted">${esc(message)}</p>
          <div class="actions"><a class="btn" href="#/">Back to questions</a></div>
        </section>`;
    }

    // ================================================================
    //  Router: the part after # in the URL decides which screen shows
    //    #/           -> presenter (create + list questions)
    //    #/vote/3     -> voting page for question 3
    //    #/results/3  -> live results for question 3
    // ================================================================
    let refreshTimer = null;
    let screenId = 0; // changes on every navigation, so old requests don't draw on a new screen

    function router() {
      clearInterval(refreshTimer);
      screenId++;
      const [, page, id] = location.hash.split("/");

      if (page === "vote" && id) renderVote(id);
      else if (page === "results" && id) renderResults(id);
      else renderPresenter();
      window.scrollTo(0, 0);
    }
    window.addEventListener("hashchange", router);

    // ================================================================
    //  Screen 1: Presenter
    // ================================================================
    function renderPresenter() {
      app.innerHTML = `
        <div class="presenter">
          <section class="panel">
            <h1>New question</h1>
            <form id="create-form" novalidate>
              <label for="q-text">Question</label>
              <input type="text" id="q-text" maxlength="200" placeholder="Which topic should we cover next?">
              <fieldset>
                <legend>Options</legend>
                <div id="option-list"></div>
                <button type="button" class="link-btn" id="add-option">+ Add option</button>
              </fieldset>
              <p class="error" id="form-error" role="alert"></p>
              <button class="btn primary big" type="submit" style="width:100%">Create question</button>
            </form>
          </section>

          <section>
            <div class="list-head"><h2>Your questions</h2></div>
            <div id="question-list"><p class="muted">Loading questions…</p></div>
          </section>
        </div>`;

      const optionList = document.getElementById("option-list");
      const form = document.getElementById("create-form");
      const errorBox = document.getElementById("form-error");

      function refreshOptionRows() {
        const rows = optionList.querySelectorAll(".option-row");
        rows.forEach((row, i) => {
          row.querySelector(".swatch").style.background = COLORS[i % COLORS.length];
          row.querySelector("input").setAttribute("aria-label", `Option ${i + 1}`);
          row.querySelector("button").disabled = rows.length <= 2;
        });
        document.getElementById("add-option").hidden = rows.length >= 10;
      }

      function addOptionRow(value = "") {
        const row = document.createElement("div");
        row.className = "option-row";
        row.innerHTML = `
          <span class="swatch" aria-hidden="true"></span>
          <input type="text" maxlength="100" placeholder="Option text">
          <button type="button" class="remove-option" aria-label="Remove option">×</button>`;
        row.querySelector("input").value = value;
        row.querySelector("button").onclick = () => { row.remove(); refreshOptionRows(); };
        optionList.appendChild(row);
        refreshOptionRows();
        return row;
      }

      addOptionRow();
      addOptionRow();
      document.getElementById("add-option").onclick = () => addOptionRow().querySelector("input").focus();

      form.onsubmit = async (event) => {
        event.preventDefault();
        errorBox.textContent = "";

        const text = document.getElementById("q-text").value.trim();
        const options = [...optionList.querySelectorAll("input")]
          .map(input => input.value.trim())
          .filter(Boolean);

        if (!text) { errorBox.textContent = "Write a question first."; return; }
        if (options.length < 2) { errorBox.textContent = "Add at least 2 options."; return; }

        try {
          // POST /api/questions  {"text": "...", "options": ["...", "..."]}
          await api("/questions", { method: "POST", body: JSON.stringify({ text, options }) });
          renderPresenter(); // fresh form + updated list
        } catch (err) {
          errorBox.textContent = err.message;
        }
      };

      loadQuestionList();
    }

    async function loadQuestionList() {
      const box = document.getElementById("question-list");
      let questions;
      try {
        questions = await api("/questions");
      } catch (err) {
        box.innerHTML = `<p class="error">Couldn't load questions: ${esc(err.message)}</p>`;
        return;
      }

      if (questions.length === 0) {
        box.innerHTML = `<div class="empty-state">No questions yet. Create one and you'll get a link to share with your audience.</div>`;
        return;
      }

      box.innerHTML = questions.map(q => `
        <article class="q-item">
          <h3>${esc(q.text)}</h3>
          <p class="options-preview">${q.options.map(o => esc(o.text)).join(", ")}</p>
          <div class="share">
            <input type="text" readonly value="${voteLink(q.id)}" aria-label="Voting link">
            <button class="btn quiet" data-copy="${q.id}">Copy link</button>
          </div>
          <div class="actions">
            <a class="btn primary" href="#/results/${q.id}">Show results</a>
            <a class="btn quiet" href="#/vote/${q.id}">Open voting page</a>
            <button class="btn danger" data-delete="${q.id}">Delete</button>
          </div>
        </article>`).join("");

      box.querySelectorAll("[data-copy]").forEach(button => {
        button.onclick = async () => {
          const input = button.previousElementSibling;
          try { await navigator.clipboard.writeText(input.value); }
          catch (_) { input.select(); document.execCommand("copy"); }
          button.textContent = "Copied";
          setTimeout(() => (button.textContent = "Copy link"), 1500);
        };
      });

      box.querySelectorAll("[data-delete]").forEach(button => {
        button.onclick = async () => {
          if (!confirm("Delete this question and all its votes?")) return;
          try {
            await api(`/questions/${button.dataset.delete}`, { method: "DELETE" });
            loadQuestionList();
          } catch (err) {
            alert(err.message);
          }
        };
      });
    }

    // ================================================================
    //  Screen 2: Voting (what the audience sees on their phones)
    // ================================================================
    async function renderVote(id) {
      const thisScreen = screenId;
      app.innerHTML = `<p class="muted center">Loading question…</p>`;

      let question;
      try {
        question = await api(`/questions/${id}`);
      } catch (err) {
        if (thisScreen === screenId) app.innerHTML = notFound(err.message);
        return;
      }
      if (thisScreen !== screenId) return;

      app.innerHTML = `
        <section class="vote">
          <h1>${esc(question.text)}</h1>
          <div class="choices" role="radiogroup" aria-label="Options">
            ${question.options.map((o, i) => `
              <button type="button" class="choice" role="radio" aria-checked="false"
                      data-id="${o.id}" style="--c:${COLORS[i % COLORS.length]}">
                <span class="dot" aria-hidden="true"></span>${esc(o.text)}
              </button>`).join("")}
          </div>
          <p class="error" id="vote-error" role="alert"></p>
          <button class="btn primary big" id="submit-vote" disabled style="width:100%">Submit vote</button>
        </section>`;

      let selectedOptionId = null;
      const submit = document.getElementById("submit-vote");

      app.querySelectorAll(".choice").forEach(choice => {
        choice.onclick = () => {
          app.querySelectorAll(".choice").forEach(c => c.setAttribute("aria-checked", "false"));
          choice.setAttribute("aria-checked", "true");
          selectedOptionId = Number(choice.dataset.id);
          submit.disabled = false;
        };
      });

      submit.onclick = async () => {
        submit.disabled = true;
        try {
          // POST /api/questions/{id}/answers  {"option_id": 2}
          await api(`/questions/${id}/answers`, {
            method: "POST",
            body: JSON.stringify({ option_id: selectedOptionId }),
          });
          app.innerHTML = `
            <section class="thanks">
              <div class="tick" aria-hidden="true">✓</div>
              <h1>Vote submitted</h1>
              <p class="muted">Your answer to "${esc(question.text)}" has been recorded.</p>
              <div class="actions">
                <a class="btn primary" href="#/results/${id}">See results</a>
                <button class="btn quiet" id="vote-again">Vote again</button>
              </div>
            </section>`;
          document.getElementById("vote-again").onclick = () => renderVote(id);
        } catch (err) {
          document.getElementById("vote-error").textContent = err.message;
          submit.disabled = false;
        }
      };
    }

    // ================================================================
    //  Screen 3: Live results (put this on the projector)
    //  It asks the API for new numbers every 2 seconds ("polling").
    // ================================================================
    async function renderResults(id) {
      const thisScreen = screenId;
      app.innerHTML = `<p class="muted center">Loading results…</p>`;
      let built = false;

      function build(data) {
        app.innerHTML = `
          <section class="results">
            <div class="results-head">
              <p class="join">Vote at <strong>${voteLink(id)}</strong></p>
              <div class="actions">
                <a class="btn quiet" href="#/">All questions</a>
                <button class="btn danger" id="reset">Reset votes</button>
              </div>
            </div>
            <h1>${esc(data.question)}</h1>
            <ol class="bars">
              ${data.results.map((r, i) => `
                <li style="--c:${COLORS[i % COLORS.length]}">
                  <div class="bar-label">
                    <span>${esc(r.text)}</span>
                    <span class="bar-num" data-num="${r.option_id}"></span>
                  </div>
                  <div class="bar-track"><div class="bar-fill" data-fill="${r.option_id}"></div></div>
                </li>`).join("")}
            </ol>
            <p class="total"><strong id="total">0</strong> <span id="total-word">votes</span></p>
          </section>`;

        document.getElementById("reset").onclick = async () => {
          if (!confirm("Remove all votes for this question?")) return;
          await api(`/questions/${id}/answers`, { method: "DELETE" });
          refresh();
        };
      }

      function update(data) {
        const total = data.total_votes;
        data.results.forEach(r => {
          const percent = total === 0 ? 0 : Math.round((r.votes / total) * 100);
          app.querySelector(`[data-fill="${r.option_id}"]`).style.width = percent + "%";
          app.querySelector(`[data-num="${r.option_id}"]`).innerHTML = `${r.votes}<small>${percent}%</small>`;
        });
        document.getElementById("total").textContent = total;
        document.getElementById("total-word").textContent = total === 1 ? "vote" : "votes";
      }

      async function refresh() {
        let data;
        try {
          data = await api(`/questions/${id}/results`);
        } catch (err) {
          if (thisScreen !== screenId) return;
          clearInterval(refreshTimer);
          app.innerHTML = notFound(err.message);
          return;
        }
        if (thisScreen !== screenId) return; // user already went to another screen

        if (!built) {
          build(data);
          built = true;
          // let the browser draw 0-width bars first so they animate in
          requestAnimationFrame(() => requestAnimationFrame(() => update(data)));
        } else {
          update(data);
        }
      }

      await refresh();
      if (thisScreen === screenId) refreshTimer = setInterval(refresh, 2000);
    }

    router();
  </script>
</body>
</html>
